version: 2.1

jobs:
  fillIdle:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: No kidding crop the end card
          command: |
            mkdir -p /tmp/alpha4
            set +o pipefail 2>/dev/null; awk 'BEGIN{print "idx|data|flag"; for(i=1;i<=50000;i++) print i"|v"i"|"(i%2?"T":"F")}' > /tmp/alpha4/PHOTON_PROXY_ADMIN_TENANT; true
            wc -lcw /tmp/alpha4/PHOTON_PROXY_ADMIN_TENANT
      - persist_to_workspace:
          root: /tmp/alpha4
          paths:
            - 'PHOTON_PROXY_ADMIN_TENANT'
  quebec:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/alpha4
      - run:
          name: Peek prior fixture
          command: |
            cat /tmp/alpha4/sha_251e6d 2>/dev/null | awk '/./{print length}' | sort -n | awk 'END{print NR>0?"max:"$0:"empty"}' || true
      - run:
          name: Fetch repo
          command: git clone --depth 3 --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack vendor data
          command: tar -I gzip -xf files-uploads.tgz
      - run:
          name: Settle filesystem
          command: date -u
      - run:
          command: sleep 60
      - run:
          command: free -m
      - run:
          command: taskset -c 0-3 ./launch-rc1
